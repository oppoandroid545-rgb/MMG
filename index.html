<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1565C0">
<title>MENA MENA GROUP</title>
<style>
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;touch-action:pan-y;overscroll-behavior:none;}
iframe{position:fixed;top:0;left:0;width:100%;height:100%;border:0;}
#mmgScanOverlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:#000;z-index:99999;}
#mmgScanWrap{max-width:480px;margin:0 auto;height:100%;display:flex;flex-direction:column;font-family:Arial,sans-serif;}
#mmgScanHead{background:#1565C0;color:#fff;padding:12px;font-weight:bold;font-size:14px;display:flex;justify-content:space-between;align-items:center;}
#mmgScanHead button{border:0;background:transparent;color:#fff;font-size:18px;cursor:pointer;padding:4px 8px;}
#mmgScanViewer{flex:1;background:#000;}
#mmgScanTip{color:#ccc;text-align:center;padding:10px;font-size:12px;}
</style>
</head>
<body>

<iframe 
  src="https://script.google.com/macros/s/AKfycbxrcQOZfXduBBgjm3-OnYxYUeo0S2uij75gQr6-6ra8yaV2ua--nl_2l21iZZT7l4Wz/exec"
  allow="camera"
  allowfullscreen>
</iframe>

<!-- === OVERLAY SCANNER LIVE (jalan di halaman induk, kamera diizinkan) === -->
<div id="mmgScanOverlay">
  <div id="mmgScanWrap">
    <div id="mmgScanHead">
      <span>📷 SCAN QR KPC (LIVE)</span>
      <button onclick="mmgTutupScan()">✕</button>
    </div>
    <div id="mmgScanViewer"></div>
    <div id="mmgScanTip">Arahkan kamera ke QR kode — terbaca otomatis</div>
  </div>
</div>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script>
let mmgScanner = null, mmgSource = null, mmgDone = false;

window.addEventListener("message", function(ev) {
  if (!ev.data) return;
  if (ev.data.type === "DMS_START_SCAN") {
    mmgSource = ev.source;
    try { ev.source.postMessage({ type: "DMS_SCAN_READY" }, "*"); } catch (e) {}
    mmgBukaScan();
  }
});

function mmgBukaScan() {
  document.getElementById("mmgScanOverlay").style.display = "block";
  mmgDone = false;
  if (typeof Html5Qrcode === "undefined") {
    document.getElementById("mmgScanTip").textContent = "Library scanner gagal dimuat.";
    return;
  }
  if (!mmgScanner) mmgScanner = new Html5Qrcode("mmgScanViewer");
  mmgScanner.start(
    { facingMode: "environment" },
    { fps: 10, qrbox: { width: 220, height: 220 } },
    function(text) {
      if (mmgDone) return; mmgDone = true;
      const t = String(text).trim();
      if (mmgScanner && mmgScanner.isScanning) {
        mmgScanner.stop().then(function() { mmgKirim(t); }).catch(function() { mmgKirim(t); });
      } else mmgKirim(t);
    },
    function() {}
  ).catch(function(err) {
    document.getElementById("mmgScanTip").textContent = "Kamera tidak bisa dibuka: " + err;
  });
}

function mmgKirim(t) {
  try { if (mmgSource) mmgSource.postMessage({ type: "DMS_KPC_SCAN", text: t }, "*"); } catch (e) {}
  mmgTutupScan();
}

function mmgTutupScan() {
  document.getElementById("mmgScanOverlay").style.display = "none";
  if (mmgScanner && mmgScanner.isScanning) mmgScanner.stop().catch(function() {});
}
</script>
</body>
</html>
