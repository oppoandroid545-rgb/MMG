<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1565C0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MENA MENA GROUP">
<title>MENA MENA GROUP</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jsqr/1.4.0/jsQR.min.js"></script>

<style>
  :root { --crop: 0px; }

  html, body {
    margin:0; padding:0;
    width:100%; height:100%;
    background:#1565C0;
    overflow:hidden;
  }

  #splash {
    position:fixed; top:0; left:0; right:0; bottom:0;
    background:#1565C0;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:14px;
    z-index:5;
    transition:opacity .4s;
  }
  #splash.hide { opacity:0; pointer-events:none; }
  #splash .logo {
    width:70px; height:70px; border-radius:18px;
    background:#fff;
    display:flex; align-items:center; justify-content:center;
    font-size:34px; font-weight:bold; color:#1565C0;
    font-family:Arial, sans-serif;
    box-shadow:0 6px 18px rgba(0,0,0,.25);
  }
  #splash .txt {
    color:#fff; font-family:Arial, sans-serif;
    font-size:15px; font-weight:bold; letter-spacing:2px;
  }
  #splash .sub {
    color:rgba(255,255,255,.75); font-family:Arial, sans-serif;
    font-size:11px; letter-spacing:1px; margin-top:-8px;
  }
  .spin {
    width:34px; height:34px;
    border:4px solid rgba(255,255,255,.3);
    border-top-color:#fff;
    border-radius:50%;
    animation:sp 1s linear infinite;
  }
  @keyframes sp { to { transform:rotate(360deg); } }

  #frame {
    position:absolute;
    left:0; width:100%;
    top:calc(-1 * var(--crop));
    height:calc(100% + var(--crop));
    border:0;
    background:#fff;
  }

  #topScanModal {
    display:none;
    position:fixed;
    top:0; left:0; right:0; bottom:0;
    background:rgba(0,0,0,.92);
    z-index:99999999;
    align-items:center;
    justify-content:center;
    padding:16px;
    box-sizing:border-box;
  }
  .top-scan-box {
    width:100%;
    max-width:430px;
    text-align:center;
    font-family:Arial, sans-serif;
  }
  .top-scan-title {
    color:#fff;
    font-size:15px;
    font-weight:bold;
    margin-bottom:10px;
  }
  /* ★ BINGKAI VIDEO */
  .top-scan-frame {
    position:relative;
    width:100%;
    overflow:hidden;
    border-radius:12px;
    background:#000;
  }
  #topScanVideo {
    width:100%;
    max-height:55vh;
    display:block;
    object-fit:cover;
    background:#000;
  }
  /* ★ 4 SUDUT PUTIH + AREA LUAR GELAP (seperti gambar) */
  .top-scan-overlay {
    position:absolute; top:0; left:0; right:0; bottom:0;
    display:flex; align-items:center; justify-content:center;
    pointer-events:none;
  }
  .top-scan-corners {
    position:relative;
    width:64%; max-width:300px; aspect-ratio:1/1;
    background:rgba(255,255,255,.06);
    box-shadow:0 0 0 9999px rgba(0,0,0,.35);
  }
  .top-scan-corners .c { position:absolute; width:34px; height:34px; border:0 solid #fff; }
  .top-scan-corners .tl { top:0; left:0; border-top-width:5px; border-left-width:5px; }
  .top-scan-corners .tr { top:0; right:0; border-top-width:5px; border-right-width:5px; }
  .top-scan-corners .bl { bottom:0; left:0; border-bottom-width:5px; border-left-width:5px; }
  .top-scan-corners .br { bottom:0; right:0; border-bottom-width:5px; border-right-width:5px; }
  .top-scan-tip {
    color:rgba(255,255,255,.75);
    font-size:12px;
    margin-top:8px;
    line-height:1.4;
  }
  #topScanClose {
    margin-top:14px;
    height:42px;
    padding:0 26px;
    border:0;
    border-radius:8px;
    background:#DC2626;
    color:#fff;
    font-size:13px;
    font-weight:bold;
    cursor:pointer;
  }
  #topScanClose:active { transform:scale(.97); }

  #topScanError {
    display:none;
    margin-top:10px;
    background:#fff;
    color:#DC2626;
    border-radius:8px;
    padding:10px;
    font-size:13px;
    line-height:1.5;
    text-align:left;
  }
</style>
</head>
<body>

<div id="splash">
  <div class="logo">M</div>
  <div class="txt">MENA MENA GROUP</div>
  <div class="sub">SISTEM MANAJEMEN PRODUKSI</div>
  <div class="spin"></div>
</div>

<iframe id="frame"
  src="https://script.google.com/macros/s/AKfycbxrcQOZfXduBBgjm3-OnYxYUeo0S2uij75gQr6-6ra8yaV2ua--nl_2l21iZZT7l4Wz/exec"
  onload="document.getElementById('splash').classList.add('hide')"
  allow="camera *; microphone *; fullscreen *; autoplay *"
  allowfullscreen
  webkitallowfullscreen
  mozallowfullscreen>
</iframe>

<div id="topScanModal">
  <div class="top-scan-box">
    <div class="top-scan-title">📷 Arahkan QR KPC ke kamera</div>
    <div class="top-scan-frame">
      <video id="topScanVideo" playsinline autoplay muted></video>
      <div class="top-scan-overlay">
        <div class="top-scan-corners">
          <span class="c tl"></span><span class="c tr"></span><span class="c bl"></span><span class="c br"></span>
        </div>
      </div>
    </div>
    <div class="top-scan-tip">Pastikan QR jelas, tidak terlalu jauh, dan cukup cahaya.</div>
    <div id="topScanError"></div>
    <button id="topScanClose" type="button">TUTUP</button>
  </div>
</div>

<script>
  /* =====================================================
     KUNCI TOMBOL BACK — LEVEL ATAS
     ===================================================== */
  (function () {
    var tahan = function () {
      try { history.pushState(null, document.title, location.href); } catch (e) {}
    };
    tahan();
    setTimeout(tahan, 50);

    window.addEventListener("popstate", function () {
      tahan();
      setTimeout(tahan, 50);
    });
    window.addEventListener("hashchange", function () { tahan(); });
  })();

  setTimeout(function () {
    document.getElementById("splash").classList.add("hide");
  }, 6000);

  /* =====================================================
     SCANNER QR TOP LEVEL (balas langsung ke pengirim)
     ===================================================== */
  var topScanStream = null;
  var topScanTimer = null;
  var scanPeminta = null;

  function balasKePeminta(data) {
    try {
      if (scanPeminta && scanPeminta.postMessage) {
        scanPeminta.postMessage(data, "*");
      }
    } catch (e) {}
  }

  function bukaTopScanner() {
    tutupTopScanner();

    var modal = document.getElementById("topScanModal");
    var video = document.getElementById("topScanVideo");
    var errBox = document.getElementById("topScanError");

    errBox.style.display = "none";
    errBox.innerHTML = "";
    modal.style.display = "flex";

    balasKePeminta({ type: "DMS_SCAN_READY" });

    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      errBox.style.display = "block";
      errBox.innerHTML = "Browser tidak mendukung kamera.<br>Silakan isi KPC manual.";
      return;
    }

    navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: { ideal: "environment" },
        width: { ideal: 1920 },
        height: { ideal: 1080 }
      },
      audio: false
    }).then(function(stream) {
      topScanStream = stream;
      video.srcObject = stream;

      try {
        var p = video.play();
        if (p && p.catch) p.catch(function(){});
      } catch (e) {}

      var canvas = document.createElement("canvas");
      var ctx = canvas.getContext("2d");

      topScanTimer = setInterval(function() {
        if (!video.videoWidth || video.readyState !== video.HAVE_ENOUGH_DATA) return;

        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

        var imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        var code = null;

        if (typeof jsQR !== "undefined") {
          code = jsQR(imgData.data, imgData.width, imgData.height, { inversionAttempts: "attemptBoth" });
        }

        if (code && code.data) {
          balasKePeminta({ type: "DMS_KPC_SCAN", text: code.data });
          tutupTopScanner();
        }
      }, 350);

    }).catch(function(err) {
      errBox.style.display = "block";
      errBox.innerHTML =
        "Kamera tidak bisa dibuka:<br><b>" + (err && err.message ? err.message : err) + "</b><br><br>" +
        "Cek izin kamera Chrome dan izin kamera situs ini.";
    });
  }

  function tutupTopScanner() {
    if (topScanTimer) {
      clearInterval(topScanTimer);
      topScanTimer = null;
    }

    if (topScanStream) {
      try {
        topScanStream.getTracks().forEach(function(t) { t.stop(); });
      } catch (e) {}
      topScanStream = null;
    }

    var video = document.getElementById("topScanVideo");
    if (video) {
      try { video.pause(); } catch (e) {}
      video.srcObject = null;
    }

    var modal = document.getElementById("topScanModal");
    if (modal) modal.style.display = "none";
  }

  document.getElementById("topScanClose").onclick = tutupTopScanner;

  if (!window.__dmsScanListenerAdded) {
    window.__dmsScanListenerAdded = true;
    window.addEventListener("message", function(ev) {
      if (ev.data && ev.data.type === "DMS_START_SCAN") {
        scanPeminta = ev.source;
        bukaTopScanner();
      }
    });
  }
</script>

</body>
</html>
