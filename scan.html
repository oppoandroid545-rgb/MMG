<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>SCAN KPC</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsqr/1.4.0/jsQR.min.js"></script>
<style>
  html,body{margin:0;height:100%;background:#000;font-family:Arial,sans-serif;overflow:hidden;}
  #video{width:100%;height:100%;object-fit:cover;}

  /* ★ BINGKAI BIDIKAN: 4 SUDUT PUTIH TEBAL (seperti gambar) */
  #frame{
    position:fixed;top:0;left:0;right:0;bottom:0;
    display:flex;align-items:center;justify-content:center;
    pointer-events:none;overflow:hidden;
  }
  #scanBox{
    position:relative;
    width:min(66vw,52vh);
    height:min(66vw,52vh);
    background:rgba(255,255,255,.05);
    box-shadow:0 0 0 9999px rgba(0,0,0,.35); /* ★ luar kotak sedikit gelap */
  }
  #scanBox .c{position:absolute;width:36px;height:36px;border:0 solid #fff;}
  #scanBox .tl{top:0;left:0;border-top-width:6px;border-left-width:6px;}
  #scanBox .tr{top:0;right:0;border-top-width:6px;border-right-width:6px;}
  #scanBox .bl{bottom:0;left:0;border-bottom-width:6px;border-left-width:6px;}
  #scanBox .br{bottom:0;right:0;border-bottom-width:6px;border-right-width:6px;}

  #msg{position:fixed;bottom:0;left:0;right:0;background:rgba(0,0,0,.65);color:#fff;padding:12px;font-size:13px;text-align:center;}
  #done{position:fixed;top:0;left:0;right:0;bottom:0;background:#fff;display:none;align-items:center;justify-content:center;text-align:center;padding:20px;}
</style>
</head>
<body>
<video id="video" autoplay playsinline muted></video>

<!-- ★ BINGKAI 4 SUDUT -->
<div id="frame">
  <div id="scanBox">
    <span class="c tl"></span><span class="c tr"></span>
    <span class="c bl"></span><span class="c br"></span>
  </div>
</div>

<div id="msg">Arahkan QR ke dalam kotak — terbaca otomatis</div>
<div id="done">
  <div>
    <div style="font-size:44px;">✅</div>
    <div style="font-size:16px;font-weight:bold;margin:10px 0;color:#1F2937;">QR Terdeteksi</div>
    <div id="doneText" style="font-size:13px;color:#6B7280;word-break:break-all;"></div>
    <div id="doneHint" style="font-size:14px;color:#1565C0;margin-top:14px;font-weight:bold;">Silakan kembali ke aplikasi — kode masuk otomatis.</div>
  </div>
</div>
<script>
const APP_URL = "https://script.google.com/macros/s/AKfycbxrcQOZfXduBBgjm3-OnYxYUeo0S2uij75gQr6-6ra8yaV2ua--nl_2l21iZZT7l4Wz/exec";
const MODE_APP = (new URLSearchParams(location.search)).get("app") === "1";
let sent = false;

function kirim(text) {
  if (sent) return;
  sent = true;
  try {
    if (window.parent && window.parent !== window) window.parent.postMessage({ type: "DMS_KPC_SCAN", text: text }, "*");
    if (window.opener) window.opener.postMessage({ type: "DMS_KPC_SCAN", text: text }, "*");
  } catch (e) {}
  if (MODE_APP) {
    fetch(APP_URL + "?action=saveScan&text=" + encodeURIComponent(text)).catch(function(){});
    document.getElementById("doneText").textContent = text;
    document.getElementById("done").style.display = "flex";
  }
}

navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment", width: { ideal: 1920 }, height: { ideal: 1080 } } })
  .then(function(s) {
    const v = document.getElementById("video");
    v.srcObject = s;
    try { window.parent.postMessage({ type: "DMS_SCAN_READY" }, "*"); } catch (e) {}
    setInterval(tick, 400);
  })
  .catch(function(err) {
    document.getElementById("msg").textContent = "Kamera tidak bisa dibuka: " + err.name;
  });

const canvas = document.createElement("canvas");
function tick() {
  const v = document.getElementById("video");
  if (!v.videoWidth) return;
  canvas.width = v.videoWidth;
  canvas.height = v.videoHeight;
  const ctx = canvas.getContext("2d");
  ctx.drawImage(v, 0, 0);
  const d = ctx.getImageData(0, 0, canvas.width, canvas.height);
  const code = jsQR(d.data, d.width, d.height, { inversionAttempts: "attemptBoth" });
  if (code && code.data) kirim(code.data);
}
</script>
</body>
</html>
