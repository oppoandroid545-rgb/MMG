<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>SCAN KPC</title>
<style>
html,body{margin:0;background:#000;height:100%;font-family:Arial,sans-serif;color:#fff;}
#wrap{max-width:480px;margin:0 auto;height:100%;display:flex;flex-direction:column;}
#head{background:#1565C0;padding:12px;font-weight:bold;font-size:14px;display:flex;justify-content:space-between;align-items:center;}
#head button{border:0;background:transparent;color:#fff;font-size:18px;cursor:pointer;padding:4px 8px;}
#viewer{position:relative;flex:1;overflow:hidden;background:#000;}
#video{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;}
#frame{position:absolute;top:50%;left:50%;width:min(60vw,240px);height:min(60vw,240px);transform:translate(-50%,-50%);border:2px solid rgba(255,255,255,.95);border-radius:14px;box-shadow:0 0 0 9999px rgba(0,0,0,.45);}
#hasil{display:none;background:#2e7d32;padding:14px;text-align:center;font-weight:bold;font-size:14px;}
#tip{color:#ccc;text-align:center;padding:10px;font-size:12px;}
</style>
</head>
<body>
<div id="wrap">
  <div id="head"><span>📷 SCAN QR KPC (LIVE)</span><button onclick="window.close()">✕</button></div>
  <div id="viewer">
    <video id="video" playsinline autoplay muted></video>
    <div id="frame"></div>
  </div>
  <div id="hasil"></div>
  <div id="tip">Arahkan QR ke dalam kotak — terbaca otomatis</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script>
let stream=null, raf=null, last=0, done=false;
const canvas=document.createElement("canvas");

function mulai(){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
    document.getElementById("tip").textContent="Browser tidak mendukung kamera.";return;
  }
  navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"},audio:false})
  .then(function(s){
    stream=s;
    const v=document.getElementById("video");
    v.srcObject=s;v.play();
    loop();
  })
  .catch(function(err){
    document.getElementById("tip").textContent="Kamera tidak bisa dibuka: "+err;
  });
}
function loop(){
  raf=requestAnimationFrame(loop);
  const now=Date.now();
  if(now-last<200||done)return;
  last=now;
  const v=document.getElementById("video");
  if(!v.videoWidth)return;
  canvas.width=v.videoWidth;canvas.height=v.videoHeight;
  const ctx=canvas.getContext("2d");
  ctx.drawImage(v,0,0,v.videoWidth,v.videoHeight);
  const code=jsQR(ctx.getImageData(0,0,v.videoWidth,v.videoHeight).data,v.videoWidth,v.videoHeight);
  if(code&&code.data){ sukses(code.data.trim()); }
}
function sukses(t){
  if(done)return; done=true;
  document.getElementById("hasil").style.display="block";
  document.getElementById("hasil").textContent="✅ "+t;
  try{ if(window.opener){ window.opener.postMessage({type:"DMS_KPC_SCAN",text:t},"*"); } }catch(e){}
  setTimeout(function(){ window.close(); },900);
}
window.addEventListener("load",mulai);
</script>
</body>
</html>
