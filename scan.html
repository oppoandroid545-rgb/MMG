<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>SCAN KPC</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<style>
  html,body{margin:0;background:#000;height:100%;font-family:Arial,sans-serif;color:#fff;}
  #wrap{max-width:480px;margin:0 auto;display:flex;flex-direction:column;height:100%;}
  #head{background:#1565C0;padding:12px;font-weight:bold;font-size:14px;display:flex;justify-content:space-between;align-items:center;}
  #head button{border:0;background:transparent;color:#fff;font-size:18px;cursor:pointer;}
  #viewer{width:100%;min-height:260px;background:#000;}
  #hasil{display:none;background:#2e7d32;padding:14px;text-align:center;font-weight:bold;font-size:14px;}
  #tip{color:#ccc;text-align:center;padding:10px;font-size:12px;}
  #btnFoto{display:none;margin:10px auto;padding:10px 16px;border:0;border-radius:8px;background:#1565C0;color:#fff;font-weight:bold;cursor:pointer;}
</style>
</head>
<body>
<div id="wrap">
  <div id="head"><span>📷 SCAN QR KPC (LIVE)</span><button onclick="window.close()">✕</button></div>
  <div id="viewer"></div>
  <div id="hasil"></div>
  <button id="btnFoto" onclick="document.getElementById('fbFile').click()">📁 Kamera gagal? Pakai FOTO</button>
  <input type="file" id="fbFile" accept="image/*" capture="environment" style="display:none" onchange="prosesFoto(this)">
  <div id="tip">Arahkan kamera ke QR kode — terbaca otomatis</div>
</div>
<script>
let scanner=null, terkirim=false;
function mulai(){
  if(typeof Html5Qrcode==="undefined"){document.getElementById("tip").textContent="Library gagal dimuat.";return;}
  scanner=new Html5Qrcode("viewer");
  scanner.start({facingMode:"environment"},{fps:10,qrbox:{width:220,height:220}},
    function(text){ sukses(String(text).trim()); },
    function(){}
  ).catch(function(err){
    document.getElementById("tip").textContent="Kamera tidak bisa dibuka. Silakan pakai tombol FOTO.";
    document.getElementById("btnFoto").style.display="block";
  });
}
function sukses(t){
  if(terkirim)return; terkirim=true;
  document.getElementById("hasil").style.display="block";
  document.getElementById("hasil").textContent="✅ "+t;
  if(scanner&&scanner.isScanning){scanner.stop().then(function(){kirim(t);}).catch(function(){kirim(t);});}
  else kirim(t);
}
function kirim(t){
  try{ if(window.opener){ window.opener.postMessage({type:"DMS_KPC_SCAN",text:t},"*"); } }catch(e){}
  setTimeout(function(){window.close();},900);
}
function prosesFoto(inp){
  const f=inp.files&&inp.files[0]; if(!f)return;
  const r=new FileReader();
  r.onload=function(ev){
    const img=new Image();
    img.onload=function(){
      const c=document.createElement("canvas");
      const s=Math.min(1,1200/Math.max(img.width,img.height));
      c.width=Math.round(img.width*s); c.height=Math.round(img.height*s);
      const x=c.getContext("2d"); x.drawImage(img,0,0,c.width,c.height);
      const d=x.getImageData(0,0,c.width,c.height);
      const code=jsQR(d.data,c.width,c.height);
      if(code&&code.data){ sukses(code.data.trim()); }
      else{ alert("QR tidak terbaca. Coba foto lebih dekat."); }
    };
    img.src=ev.target.result;
  };
  r.readAsDataURL(f);
}
window.addEventListener("load",mulai);
</script>
</body>
</html>
